<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Agentro system map</title>
  <desc id="desc">How Agentro is organized: public routes, tRPC API, MySQL CMS content, and the admin dashboard.</desc>
  <defs>
    <linearGradient id="wfbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#15101C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#wfbg)"/>
  <text x="48" y="52" fill="#8BA3C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">SYSTEM MAP</text>
  <text x="48" y="96" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">방문자가 보는 화면과, 운영자가 고치는 콘텐츠</text>

  <g transform="translate(48 140)">
    <rect width="340" height="220" rx="18" fill="#101A2E" stroke="#24324A" stroke-width="1.5"/>
    <text x="24" y="40" fill="#5EB6EF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">PUBLIC</text>
    <text x="24" y="76" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">Home · Webinar</text>
    <text x="24" y="108" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">Instructors · Programs</text>
    <text x="24" y="152" fill="#A8B7CC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">오케스트레이션 Hero</text>
    <text x="24" y="180" fill="#A8B7CC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">웨비나 사전 신청</text>
    <text x="24" y="208" fill="#A8B7CC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">강사 · 프로그램 상세</text>
  </g>

  <g transform="translate(430 140)">
    <rect width="340" height="220" rx="18" fill="#101A2E" stroke="#FFB900" stroke-width="2"/>
    <text x="24" y="40" fill="#FFD56A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">API / DATA</text>
    <text x="24" y="76" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">tRPC + Express</text>
    <text x="24" y="108" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">Drizzle · MySQL</text>
    <text x="24" y="152" fill="#A8B7CC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">site_settings CMS</text>
    <text x="24" y="180" fill="#A8B7CC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">OAuth admin session</text>
    <text x="24" y="208" fill="#A8B7CC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">S3 photo · CSV export</text>
  </g>

  <g transform="translate(812 140)">
    <rect width="340" height="220" rx="18" fill="#101A2E" stroke="#D10056" stroke-width="2"/>
    <text x="24" y="40" fill="#F06A9A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">ADMIN</text>
    <text x="24" y="76" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">Dashboard CMS</text>
    <text x="24" y="108" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">CRUD · Publish</text>
    <text x="24" y="152" fill="#A8B7CC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">홈 · Hero · 커리큘럼</text>
    <text x="24" y="180" fill="#A8B7CC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">강사 · 프로그램 · FAQ</text>
    <text x="24" y="208" fill="#A8B7CC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">웨비나 신청자 관리</text>
  </g>

  <path d="M388 250 H430" stroke="#44556F" stroke-width="2" fill="none"/>
  <path d="M770 250 H812" stroke="#44556F" stroke-width="2" fill="none"/>
</svg>
