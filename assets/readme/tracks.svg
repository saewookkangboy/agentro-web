<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Three curriculum tracks</title>
  <desc id="desc">Agentro curriculum tracks: AI Agent Builder, Content Automation, and Marketing Automation.</desc>
  <rect width="1200" height="320" rx="26" fill="#0B1220"/>

  <g transform="translate(40 40)">
    <rect width="360" height="240" rx="18" fill="#101A2E" stroke="#007DCC" stroke-width="2"/>
    <text x="24" y="42" fill="#5EB6EF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">TRACK / 01</text>
    <text x="24" y="88" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">AI Agent Builder</text>
    <text x="24" y="136" fill="#B8C4D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">조사·판단·실행·검증을</text>
    <text x="24" y="164" fill="#B8C4D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">연결하는 Agent 설계</text>
    <text x="24" y="210" fill="#8BA3C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">업무 분해 · 컨텍스트 · 도구</text>
  </g>

  <g transform="translate(420 40)">
    <rect width="360" height="240" rx="18" fill="#101A2E" stroke="#FFB900" stroke-width="2"/>
    <text x="24" y="42" fill="#FFD56A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">TRACK / 02</text>
    <text x="24" y="88" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">Content Automation</text>
    <text x="24" y="136" fill="#B8C4D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">기획부터 배포 준비까지</text>
    <text x="24" y="164" fill="#B8C4D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">콘텐츠 생산 흐름 표준화</text>
    <text x="24" y="210" fill="#8BA3C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">브랜드 · 멀티채널 · 검수</text>
  </g>

  <g transform="translate(800 40)">
    <rect width="360" height="240" rx="18" fill="#101A2E" stroke="#D10056" stroke-width="2"/>
    <text x="24" y="42" fill="#F06A9A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">TRACK / 03</text>
    <text x="24" y="88" fill="#F7F4EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">Marketing Automation</text>
    <text x="24" y="136" fill="#B8C4D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">캠페인·리드·성과 보고를</text>
    <text x="24" y="164" fill="#B8C4D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">하나의 운영 시스템으로</text>
    <text x="24" y="210" fill="#8BA3C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">퍼널 · 리드 · 성과 측정</text>
  </g>
</svg>
